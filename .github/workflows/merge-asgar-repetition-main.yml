name: Merge curated Asgar repetition pass into main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-asgar-repetition-main.yml'

permissions:
  contents: write

jobs:
  merge-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply literary changes from curated Asgar branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin promote-asgar-repetition
          BASE="$(git merge-base HEAD origin/promote-asgar-repetition)"
          echo "merge base: $BASE"
          git diff "$BASE"..origin/promote-asgar-repetition -- \
            chapters_v2 \
            ':(exclude)chapters_v2/20-vozrozhdenie.md' \
            ':(exclude)chapters_v2/22-ya-ostayus.md' \
            ':(exclude)chapters_v2/25-istochnik.md' \
            > /tmp/asgar.patch
          if [ -s /tmp/asgar.patch ]; then
            git apply --3way --index /tmp/asgar.patch
          fi
          git diff --cached --check
          echo '=== changed chapters ==='
          git diff --cached --name-only -- chapters_v2

      - name: Commit merged literary pass
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Merge curated Asgar repetition pass into main"
          git push origin HEAD:main
