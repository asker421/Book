name: Apply chapter 14 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch14-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand folded dialogue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chapters_v2/14-mashiny-bez-hozyaev.md')
          text = p.read_text(encoding='utf-8')
          repls = [
            (
              '''Асгар открыл дверь, обе ноги оставил снаружи и снял трубку. Женский голос сообщил: материализация держится, но запустить возврат пока нельзя. Активная внешняя система непрерывно перестраивает локальную среду, поэтому возвратная граница не может завершить стабилизацию. Асгар спросил, какая система. Женщина не успела ответить. Эмил за спиной резко поднял руку.''',
              '''Асгар открыл дверь, обе ноги оставил снаружи и снял трубку.\n\n— Материализация держится. Возврат пока запустить нельзя.\n\n— Почему?\n\n— Активная внешняя система непрерывно перестраивает локальную среду. Возвратная граница не может завершить стабилизацию.\n\n— Какая система?\n\nЖенщина не успела ответить. Эмил за спиной резко поднял руку.'''
            ),
            (
              '''Асгар замер. Машина не говорила с ним как с целью. Она объявляла режим. Женщина на линии велела держать дверь открытой: закрытие могло запустить переход, пока внешняя граница ещё нестабильна. Первая машина повторила сообщение, затем добавила: «Civilian route unavailable. Maintain exclusion boundary».''',
              '''Асгар замер. Машина не говорила с ним как с целью. Она объявляла режим.\n\n— Держите дверь открытой.\n\n— Почему?\n\n— Закрытие может запустить переход. Внешняя граница ещё нестабильна.\n\nПервая машина повторила сообщение, затем добавила: «Civilian route unavailable. Maintain exclusion boundary».'''
            ),
            (
              '''Сканирование, похоже, само ухудшало устойчивость. В трубке люди начали говорить быстрее; несколько параметров границы расходились. Асгар крикнул по-английски, что в контролируемой зоне находится гражданский, и спросил, можно ли отключить сканирование. Машина ответила: требуется авторизация. Затем назвала набор кодов и контур полномочий, которых у Асгара, Эмила и, вероятно, вообще у живых людей вокруг давно не существовало.''',
              '''Сканирование, похоже, само ухудшало устойчивость. В трубке люди начали говорить быстрее; несколько параметров границы расходились. Асгар крикнул машине по-английски:\n\n— Civilian inside controlled zone. Can you disable scanning?\n\n— Authorization required.\n\nЗатем машина назвала набор кодов и контур полномочий, которых у Асгара, Эмила и, вероятно, вообще у живых людей вокруг давно не существовало.'''
            ),
          ]
          for i, (old, new) in enumerate(repls, 1):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/14-mashiny-bez-hozyaev.md
          git diff --cached --check
          git commit -m "Expand folded dialogue in chapter 14"
          git push
