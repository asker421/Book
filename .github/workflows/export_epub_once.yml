name: Export Current EPUB Once

on:
  push:
    paths:
      - '.github/workflows/export_epub_once.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: krasnaya-budka-epub
          path: release/krasnaya-budka-v2-FROZEN.epub
          if-no-files-found: error
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/export_epub_once.yml
          git commit -m "chore: remove EPUB export workflow"
          git push
