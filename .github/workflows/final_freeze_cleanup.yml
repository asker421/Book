name: Final freeze cleanup

on:
  push:
    paths:
      - '.github/workflows/final_freeze_cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply two exact replacements
        shell: python
        run: |
          from pathlib import Path

          def repl(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('OK', label)

          repl(
              'chapters_v2/17-posle-vtorogo-padeniya.md',
              'Люди Ар не считали ручное действие морально лучше машины; они просто оставляли человеку возможность остановить цепь.',
              'Рен пожал плечами: иногда ручной режим просто медленнее.',
              'P1'
          )

          repl(
              'chapters_v2/30-sotni-millionov-let.md',
              'Асгар ещё раз посмотрел на перечень разрешённых вмешательств. Узел мог удержать воду, защитить отдельную линию жизни, смягчить локальную катастрофу — и на этом его полномочия заканчивались. Всё остальное уже означало бы не сохранение Земли, а строительство другой Земли поверх неё.\n\n',
              '',
              'P2'
          )

      - name: Commit fiction only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2
          git diff --cached --check
          git commit -m "fix: remove final semantic overproof"
          git push origin HEAD:main
