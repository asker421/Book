name: Final minor literary surgery

on:
  push:
    paths:
      - '.github/workflows/final_minor_surgery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact replacements
        shell: python
        run: |
          from pathlib import Path

          def repl(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('OK', label)

          repl('chapters_v2/17-posle-vtorogo-padeniya.md',
               'Вот тогда Ар стал понятнее любой исторической лекции. Здесь не пытались построить систему, которая никогда не ошибается. Строили так, чтобы ошибка имела ограниченный радиус и чтобы в конце оставался физический мир, который можно проверить глазами.',
               'Асгар посмотрел на канал. Вода уже снова шла ровно, и Рен, не дожидаясь подтверждения от системы, понёс снятый датчик в мастерскую.',
               'P1')

          repl('chapters_v2/22-ya-ostayus.md',
               'Асгар обозвал это очередным правильным ответом людей будущего. Иара ответила, что просто не хочет слушать его двадцать лет. Они оба рассмеялись, и на несколько секунд выбор перестал быть единственной вещью в мире.',
               'Асгар сказал, что это подозрительно удобный ответ. Иара ответила, что просто не хочет слушать его двадцать лет. Они оба рассмеялись, и на несколько секунд выбор перестал быть единственной вещью в мире.',
               'P2')

          repl('chapters_v2/30-sotni-millionov-let.md',
               'Асгар узнал знакомую проблему. В орбитальной эпохе аппарат сохранения чуть не создал аварийную ситуацию именно потому, что получил слишком широкое определение слова «сохранить». Здесь тот же принцип пережил сотни миллионов лет и был встроен в ограничения автоматики: помощь не даёт права сделать планету копией того состояния, которое кто-то считает правильным.',
               'Асгар ещё раз посмотрел на перечень разрешённых вмешательств. Узел мог удержать воду, защитить отдельную линию жизни, смягчить локальную катастрофу — и на этом его полномочия заканчивались. Всё остальное уже означало бы не сохранение Земли, а строительство другой Земли поверх неё.',
               'P3')

          repl('chapters_v2/35a-do-poslednego-okna.md',
               'Голосовой канал всё чаще собирали через запасные протоколы. Иногда в репликах Асгара оставались настоящие дыры — не шум, а отсутствующие слова. Мара запретила переводчику заполнять их по смыслу.',
               'Голосовой канал всё чаще собирали через запасные протоколы. Иногда в репликах Асгара оставались настоящие дыры — не шум, а отсутствующие слова.',
               'P4')

          p = Path('chapters_v2/17-posle-vtorogo-padeniya.md')
          s = p.read_text(encoding='utf-8')
          old = 'в Ар личные медицинские записи по умолчанию хранились локально. \n'
          if old not in s:
              raise SystemExit('P5: trailing whitespace anchor not found')
          p.write_text(s.replace(old, 'в Ар личные медицинские записи по умолчанию хранились локально.\n', 1), encoding='utf-8')
          print('OK P5')

      - name: Commit fiction only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2
          git diff --cached --check
          git commit -m "fix: final minor literary cleanup"
          git push origin HEAD:main
