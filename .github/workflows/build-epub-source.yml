name: Build EPUB source artifact
on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'assets/**'
      - 'tools/build_epub.py'
      - '.github/workflows/build-epub-source.yml'
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble manuscript
        shell: bash
        run: |
          set -e
          mkdir -p build
          : > build/manuscript.md
          for f in $(find chapters -maxdepth 1 -type f -name '*.md' | sort); do
            cat "$f" >> build/manuscript.md
            printf '\n\n' >> build/manuscript.md
          done
          cp -r chapters build/chapters
      - name: Prepare cover
        run: base64 -d assets/cover_epub.b64 > assets/cover_epub.jpg
      - name: Install EPUB build dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build EPUB
        run: python tools/build_epub.py
      - name: Upload manuscript and EPUB
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-budka-manuscript
          path: |
            build/
            dist/
          if-no-files-found: error
