name: Build EPUB source artifact
on:
  push:
    branches: [main]
    paths:
      - 'chapters_v2/**'
      - 'assets/**'
      - 'tools/build_epub.py'
      - '.github/workflows/build-epub-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble manuscript
        shell: bash
        run: |
          set -e
          mkdir -p build
          : > build/manuscript.md
          for f in $(find chapters_v2 -maxdepth 1 -type f -name '*.md' | sort); do
            cat "$f" >> build/manuscript.md
            printf '\n\n' >> build/manuscript.md
          done
          cp -r chapters_v2 build/chapters
      - name: Prepare cover
        run: base64 -d assets/cover_epub.b64 > assets/cover_epub.jpg
      - name: Install EPUB build dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build EPUB
        run: python tools/build_epub.py
      - name: Upload manuscript and EPUB
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-budka-manuscript
          path: |
            build/
            dist/
          if-no-files-found: error
      - name: Publish latest successful run id
        shell: bash
        run: |
          mkdir -p .github
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest_epub_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest_epub_run.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record latest EPUB artifact run [skip ci]"
          git push
