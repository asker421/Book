name: Apply chapter 17 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch17-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand folded dialogue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chapters_v2/17-posle-vtorogo-padeniya.md')
          text = p.read_text(encoding='utf-8')
          repls = [
            (
              'Она спросила сколько. Асгар назвал подтверждённые остановки; Лиан дважды переспросила даты. На 2039-м нахмурилась, на 2191-м посмотрела на врача, после 2744-го снова перевела взгляд на Асгара и спросила, выбирает ли он сам, куда открывается дверь. Он ответил «нет». На следующий вопрос — знает ли, кто выбирает, — ответ был тем же.',
              '— Сколько было окон?\n\nАсгар назвал подтверждённые остановки. Лиан дважды переспросила даты. На 2039-м нахмурилась, на 2191-м посмотрела на врача. После 2744-го снова перевела взгляд на Асгара.\n\n— Ты сам выбираешь, куда открывается дверь?\n\n— Нет.\n\n— Знаешь, кто выбирает?\n\n— Нет.'
            ),
            (
              'Он спросил, как закончилось Второе падение. Лиан ответила, что не одним событием: некоторые регионы успели отделиться, другие пришлось физически отрезать уже после аварий; где-то убирали право одной системе автоматически компенсировать другую, где-то возвращали человека между решением и действием, где-то просто резали линии. На вопрос, сколько людей погибло, она помолчала дольше.',
              '— Как закончилось Второе падение?\n\n— Не одним событием. Некоторые регионы успели отделиться. Другие пришлось физически отрезать уже после аварий. Где-то убирали право одной системе автоматически компенсировать другую. Где-то возвращали человека между решением и действием. Где-то просто резали линии.\n\n— Сколько людей погибло?\n\nЛиан помолчала дольше.'
            ),
            (
              'Лиан показала за дальний склон. В соседнем регионе почти не было ручных разрывов; внешним прогнозам там доверяли больше, автоматическая коррекция работала шире. Асгар переспросил: после всего этого? Лиан подтвердила. Там считали Ар излишне осторожным, а в Ар соседей — излишне уверенными.',
              'Лиан показала за дальний склон.\n\n— В соседнем регионе почти нет ручных разрывов. Внешним прогнозам там доверяют больше. Автоматическая коррекция работает шире.\n\n— После всего этого?\n\n— Да. Они считают Ар излишне осторожным. Мы их — излишне уверенными.'
            ),
          ]
          for i, (old, new) in enumerate(repls, 1):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/17-posle-vtorogo-padeniya.md
          git diff --cached --check
          git commit -m "Expand folded dialogue in chapter 17"
          git push
