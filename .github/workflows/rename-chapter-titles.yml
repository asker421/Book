name: Rename chapter titles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-chapter-titles.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename chapter headings and sync chapter map
        shell: python
        run: |
          from pathlib import Path
          import re

          titles = {
              1: 'Десять секунд',
              2: 'Пропавшие дни',
              3: 'Человек на записи',
              4: 'Сорок семь часов',
              5: '11:11',
              6: 'Закрытое дело',
              7: 'Жива',
              8: 'Не тот год',
              9: 'Не осталось никого',
              10: 'Красный коридор',
              11: 'Девятнадцатый день',
              12: 'Зона рассогласования',
              13: 'Тихий сектор',
              14: 'Громкий мир',
              15: 'Гражданская зона',
              16: 'Новый голос',
              17: 'Второе падение',
              18: 'Красная дверь',
              19: 'Сто третий день',
              20: 'Радиус последствий',
              21: 'Двенадцать лет',
              22: 'До точки невозврата',
              23: 'Непрерывность',
              24: 'Пассажир',
              25: 'Источник',
              26: 'Право доступа',
              27: 'Чужая Земля',
              28: 'Красная константа',
              29: 'Двадцать два месяца',
              30: 'Адресат неизвестен',
              31: 'Рекурсия',
              32: 'Красное Солнце',
              33: 'Субъективное время',
              34: 'Не сейчас',
              35: 'Чужие тысячи лет',
              36: 'RETRO-1',
              37: 'До связи, Асгар',
              38: 'Мёртвый телефон',
              39: 'Первый якорь',
              40: 'Тихое место',
          }

          files = {
              1: 'chapters_v2/01-16-avgusta.md',
              2: 'chapters_v2/02-chetyre-dnya.md',
              3: 'chapters_v2/03-sled.md',
              4: 'chapters_v2/04-okno.md',
              5: 'chapters_v2/05-dvadtsat-pyat-let.md',
              6: 'chapters_v2/06-mertvyy-chelovek.md',
              7: 'chapters_v2/07-arhiv-16-08.md',
              8: 'chapters_v2/08-vtoroe-okno.md',
              9: 'chapters_v2/09-novaya-klimaticheskaya-epoha.md',
              10: 'chapters_v2/10-krasnyy-koridor.md',
              11: 'chapters_v2/11-ozhidanie.md',
              12: 'chapters_v2/12-shturm.md',
              13: 'chapters_v2/13-posle-voyny.md',
              14: 'chapters_v2/14-mashiny-bez-hozyaev.md',
              15: 'chapters_v2/15-protokol.md',
              16: 'chapters_v2/16-mara.md',
              17: 'chapters_v2/17-posle-vtorogo-padeniya.md',
              18: 'chapters_v2/18-chelovek-iz-krasnoy-dveri.md',
              19: 'chapters_v2/19-dolgoe-ozhidanie.md',
              20: 'chapters_v2/20-vozrozhdenie.md',
              21: 'chapters_v2/21-sem-mesyatsev.md',
              22: 'chapters_v2/22-ya-ostayus.md',
              23: 'chapters_v2/23-razdelennoe-chelovechestvo.md',
              24: 'chapters_v2/24-ne-domoy.md',
              25: 'chapters_v2/25-istochnik.md',
              26: 'chapters_v2/26-orbitalnaya-ohota.md',
              27: 'chapters_v2/27-milliony-let.md',
              28: 'chapters_v2/28-posledniy-arhiv-zemli.md',
              29: 'chapters_v2/29-odin.md',
              30: 'chapters_v2/30-sotni-millionov-let.md',
              31: 'chapters_v2/31-poslanie.md',
              32: 'chapters_v2/32-smert-zemli.md',
              33: 'chapters_v2/33-poslednie-zvezdy.md',
              34: 'chapters_v2/34-bessmertie.md',
              35: 'chapters_v2/35-temnaya-epoha.md',
              36: 'chapters_v2/36-retro-1.md',
              37: 'chapters_v2/37-vy-pochti-doshli.md',
              38: 'chapters_v2/38-tishina.md',
              39: 'chapters_v2/39-liniya-istochnika.md',
              40: 'chapters_v2/40-16-avgusta.md',
          }

          interludes = {
              'I': ('chapters_v2/04a-lishnyaya-massa.md', 'Лишняя масса'),
              'II': ('chapters_v2/08a-raschet-ne-shoditsya.md', 'Расчёт не сходится'),
              'III': ('chapters_v2/15a-smena.md', 'Смена'),
              'IV': ('chapters_v2/24a-slepaya-zona.md', 'Слепая зона'),
              'V': ('chapters_v2/35a-do-poslednego-okna.md', 'Пока слышно'),
          }

          def replace_first_line(path, new_line):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              assert lines, f'Empty file: {path}'
              ending = '\r\n' if lines[0].endswith('\r\n') else '\n'
              lines[0] = new_line + ending
              p.write_text(''.join(lines), encoding='utf-8', newline='')

          for n, path in files.items():
              replace_first_line(path, f'# {n}. {titles[n]}')

          for roman, (path, title) in interludes.items():
              replace_first_line(path, f'# Интерлюдия {roman}. {title}')

          chapter_map = Path('CHAPTER_MAP.md')
          text = chapter_map.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          out = []
          for line in lines:
              m = re.match(r'^(\d+)\. \*\*.*?\*\*(\s+—.*)$', line.rstrip('\r\n'))
              if m:
                  n = int(m.group(1))
                  if n in titles:
                      eol = '\r\n' if line.endswith('\r\n') else '\n'
                      line = f'{n}. **{titles[n]}**{m.group(2)}{eol}'
              else:
                  im = re.match(r'^\*\*Интерлюдия (I|II|III|IV|V)\. «.*?»\*\*(\s+—.*)$', line.rstrip('\r\n'))
                  if im:
                      roman = im.group(1)
                      title = interludes[roman][1]
                      eol = '\r\n' if line.endswith('\r\n') else '\n'
                      line = f'**Интерлюдия {roman}. «{title}»**{im.group(2)}{eol}'
              out.append(line)
          text = ''.join(out)
          text = re.sub(r'(- Финальная глава:\s*40\. «)[^»]+(»\.)', r'\1' + titles[40] + r'\2', text)
          chapter_map.write_text(text, encoding='utf-8', newline='')

          # Verification: all 40 chapter headers and 5 interludes must be exact.
          for n, path in files.items():
              first = Path(path).read_text(encoding='utf-8').splitlines()[0]
              assert first == f'# {n}. {titles[n]}', (path, first)
          for roman, (path, title) in interludes.items():
              first = Path(path).read_text(encoding='utf-8').splitlines()[0]
              assert first == f'# Интерлюдия {roman}. {title}', (path, first)

          map_text = chapter_map.read_text(encoding='utf-8')
          for n, title in titles.items():
              assert f'{n}. **{title}**' in map_text, (n, title)
          for roman, (_, title) in interludes.items():
              assert f'**Интерлюдия {roman}. «{title}»**' in map_text, (roman, title)

      - name: Commit renamed titles and remove one-shot workflow
        run: |
          rm .github/workflows/rename-chapter-titles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2 CHAPTER_MAP.md .github/workflows/rename-chapter-titles.yml
          git commit -m "Rename all chapter titles"
          git push origin HEAD:main
