name: Apply chapter 39 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch39-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand folded dialogue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chapters_v2/39-liniya-istochnika.md')
          text = p.read_text(encoding='utf-8')
          repls = [
            (
              '''Первым вопросом Асгара всё равно стала Мара.\n\nСава объяснила: прежняя линия сопровождения закончилась раньше, чем RETRO-1 дошёл сюда. Если последний служебный сигнал вернулся назад, Мара могла увидеть только уход аппарата за границу доступного наблюдения — не прибытие.''',
              '''— Мара?\n\n— Прежняя линия сопровождения закончилась раньше, чем RETRO-1 дошёл сюда. Если последний служебный сигнал вернулся назад, Мара могла увидеть только уход аппарата за границу доступного наблюдения. Не прибытие.'''
            ),
            (
              '''Когда он спросил, почему нельзя сразу открыть 2039 год, она не стала отвечать лекцией. На полу появились две точки. Первая обозначала закрытие двери 16 августа 2014 года; вторая — позднее окно 24 августа 2039-го. У первой горела отдельная отметка пассажирской ошибки. Сава объяснила только необходимое: именно здесь Асгар стал частью незакрытого возврата, поэтому все поздние состояния уже наследовали это расхождение.''',
              '''— Почему нельзя сразу открыть 2039 год?\n\nСава не стала отвечать лекцией. На полу появились две точки. Первая обозначала закрытие двери 16 августа 2014 года; вторая — позднее окно 24 августа 2039-го. У первой горела отдельная отметка пассажирской ошибки.\n\n— Именно здесь ты стал частью незакрытого возврата. Все поздние состояния уже наследовали это расхождение.'''
            ),
          ]
          for i, (old, new) in enumerate(repls, 1):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/39-liniya-istochnika.md
          git diff --cached --check
          git commit -m "Expand folded dialogue in chapter 39"
          git push
