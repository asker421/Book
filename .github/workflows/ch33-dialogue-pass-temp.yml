name: Apply chapter 33 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch33-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact dialogue expansions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chapters_v2/33-poslednie-zvezdy.md')
          text = p.read_text(encoding='utf-8')
          repls = [
            (
              'Первым человеком, которого Асгар встретил у воды, был Селин. Он не спросил, кто перед ним и откуда появилась красная кабина. Сначала спросил, сколько бодрствования Асгар собирается потратить сегодня. Вопрос звучал нелепо ровно до того момента, пока Селин не объяснил местную арифметику. Один активный день мог быть дороже миллиона внешних лет ожидания в замедленном режиме. Жители не спали в обычном смысле и не выключались как файлы. Их физические процессы продолжались, просто в другом темпе относительно внешней среды.\n\nАсгар всё-таки спросил, чем это отличается от того, чтобы выключить его, а потом запустить копию.',
              'Первым человеком, которого Асгар встретил у воды, был Селин. Он не спросил, кто перед ним и откуда появилась красная кабина.\n\n— Сколько бодрствования собираешься потратить сегодня?\n\nАсгар посмотрел на него.\n\n— Потратить?\n\n— Один активный день может стоить больше миллиона внешних лет ожидания в замедленном режиме. Мы не спим и не выключаемся. Физические процессы продолжаются. Просто в другом темпе относительно внешней среды.\n\n— И чем это отличается от того, чтобы выключить меня, а потом запустить копию?'
            ),
            (
              'Орт посмотрел на список показателей и уточнил, что именно тот хочет считать: сердце, сосуды, нервную ткань. Одного возраста у тела не было.\n\n— Дай хотя бы порядок.\n\nНесколько субъективно прожитых лет сверх исходного состояния, ответил Орт, с поправками на стресс, лечение и травмы. Календарь к этому прикладывать было бессмысленно.',
              'Орт посмотрел на список показателей.\n\n— Что именно считать? Сердце? Сосуды? Нервную ткань? Одного возраста у тела нет.\n\n— Дай хотя бы порядок.\n\n— Несколько субъективно прожитых лет сверх исходного состояния. С поправками на стресс, лечение и травмы. Календарь сюда прикладывать бессмысленно.'
            ),
            (
              'Позже Селин всё-таки спросил, почему Асгар так упорно сохраняет привычный биологический режим, хотя Долгий дом позволял гораздо сильнее растянуть собственное субъективное время. Вопрос возник не в медицинском кабинете, а вечером, когда они снова считали активные часы. Асгар посмотрел на руки и сначала дал привычный технический ответ: именно это тело когда-то вошло в красную кабину, а лишние неизвестные в работающую пассажирскую связь он добавлять не собирался.\n\n— Это объясняет тело, — сказал Селин. — А зачем тебе бодрствовать почти в старом человеческом темпе?',
              'Позже, когда они снова считали активные часы, Селин спросил:\n\n— Почему ты так упорно сохраняешь привычный биологический режим? Долгий дом позволяет намного сильнее растянуть субъективное время.\n\nАсгар посмотрел на руки.\n\n— Именно это тело вошло в красную кабину. Лишние неизвестные в работающую пассажирскую связь я добавлять не собираюсь.\n\n— Это объясняет тело, — сказал Селин. — А зачем тебе бодрствовать почти в старом человеческом темпе?'
            ),
            (
              'Когда телефон зазвонил, часть Долгого дома уже снова уходила в медленный режим. Селин сказал, что если красная аномалия вернётся через миллион лет, для него самого может пройти несколько минут. Асгар спросил, правда ли тот готов снова потратить бодрствование на встречу. Ответ был простым: да. Не настолько, чтобы не замедляться весь миллион лет, но достаточно, чтобы принять сигнал, если система предложит проснуться.\n\n— Значит, я попадаю в список причин потратить энергию.',
              'Когда телефон зазвонил, часть Долгого дома уже снова уходила в медленный режим.\n\n— Если красная аномалия вернётся через миллион лет, для меня может пройти несколько минут, — сказал Селин.\n\n— И ты правда снова потратишь бодрствование на встречу?\n\n— Да. Не настолько, чтобы бодрствовать весь миллион лет. Но если система предложит проснуться, приму сигнал.\n\n— Значит, я попадаю в список причин потратить энергию.'
            ),
          ]
          for i, (old, new) in enumerate(repls, 1):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          print(f'Applied {len(repls)} dialogue expansions')
          PY
          git diff --check -- chapters_v2/33-poslednie-zvezdy.md
      - name: Commit chapter 33
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/33-poslednie-zvezdy.md
          git commit -m "Expand folded dialogue in chapter 33"
          git push origin HEAD:main
