name: Build EPUB
# final publication build
# cover asset verified

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare cover
        run: |
          mkdir -p assets dist
          base64 -d assets/cover_epub.b64 > assets/cover_epub.jpg
      - name: Build EPUB
        run: python3 tools/build_epub.py
      - name: Inspect output
        run: |
          file dist/Krasnaya_budka_Asker_Ismayilov.epub
          unzip -t dist/Krasnaya_budka_Asker_Ismayilov.epub
          cat dist/epub_build_report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: krasnaya-budka-epub
          path: |
            dist/Krasnaya_budka_Asker_Ismayilov.epub
            dist/epub_build_report.txt
