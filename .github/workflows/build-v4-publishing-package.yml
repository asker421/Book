name: Build V4 publishing package

on:
  push:
    branches: [main]
    paths:
      - 'chapters_v4/**'
      - 'assets/cover_wrap.png'
      - 'tools/build_v4_release.py'
      - 'tools/cover.py'
      - 'tools/verify_cover.py'
      - 'tools/verify_release_line.py'
      - '.github/workflows/build-v4-publishing-package.yml'
      - 'V4_NAMING_CANON.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install publishing dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow reportlab python-docx

      - name: Check release line and approved cover before building
        run: |
          python tools/verify_release_line.py
          python tools/verify_cover.py

      - name: Build V4 release
        run: python tools/build_v4_release.py

      # ВАЖНО: ни EPUB, ни пакет не выкладываются до этой проверки.
      # Замок fail-closed: сборка падает, если в артефактах не утверждённая обложка.
      - name: Verify every artifact carries the approved cover
        run: python tools/verify_cover.py

      - name: Upload V4 EPUB with approved cover
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-budka-v4-epub
          path: release_v4/Krasnaya_budka_Asker_Ismayilov_V4.epub
          if-no-files-found: error

      - name: Upload publishing package
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-budka-v4-publishing-package
          path: release_v4/
          if-no-files-found: error

      - name: Publish latest successful run id
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # This metadata write must not turn a valid publishing build red just
          # because main moved while the artifacts were being produced.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .github
            printf '%s\n' "$GITHUB_RUN_ID" > .github/latest_v4_release_run.txt
            git add .github/latest_v4_release_run.txt

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "ci: record latest V4 publishing package run [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 1
          done

          echo "::warning::Publishing artifacts succeeded, but latest_v4_release_run.txt could not be updated because main kept moving."
          exit 0
