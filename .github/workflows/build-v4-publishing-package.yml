name: Build V4 publishing package

on:
  push:
    branches: [main]
    paths:
      - 'chapters_v4/**'
      - 'assets/v4_cover_wrap.webp'
      - 'tools/build_v4_release.py'
      - 'tools/apply_v4_cover.py'
      - '.github/workflows/build-v4-publishing-package.yml'
      - 'V4_NAMING_CANON.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install publishing dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow reportlab python-docx
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp

      - name: Build V4 release
        run: python tools/build_v4_release.py

      # IMPORTANT: no EPUB/package artifact is uploaded before this step.
      # This step is fail-closed and locks the exact author-approved wrap asset.
      - name: Apply locked author-approved cover
        run: python tools/apply_v4_cover.py

      - name: Verify published EPUB uses approved cover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          out = Path('release_v4')
          epub = out / 'Krasnaya_budka_Asker_Ismayilov_V4.epub'
          cover = out / 'krasnaya-budka-v4-cover-epub.jpg'
          package = out / 'Krasnaya_budka_V4_PUBLISHING_PACKAGE.zip'
          full_cover = out / 'krasnaya-budka-v4-full-cover-145x215-bleed3mm.pdf'

          assert epub.exists(), epub
          assert cover.exists(), cover
          assert package.exists(), package
          assert full_cover.exists(), full_cover

          with zipfile.ZipFile(epub, 'r') as z:
              assert z.namelist()[0] == 'mimetype'
              assert z.read('OEBPS/cover.jpg') == cover.read_bytes(), 'EPUB cover is not the approved crop'

          with zipfile.ZipFile(package, 'r') as z:
              names = set(z.namelist())
              assert epub.name in names, 'Final EPUB missing from package'
              assert full_cover.name in names, 'Approved full wrap missing from package'

          print('Approved cover verification: PASS')
          PY

      - name: Upload V4 EPUB with approved cover
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-budka-v4-epub
          path: release_v4/Krasnaya_budka_Asker_Ismayilov_V4.epub
          if-no-files-found: error

      - name: Upload publishing package
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-budka-v4-publishing-package
          path: release_v4/
          if-no-files-found: error

      - name: Publish latest successful run id
        shell: bash
        run: |
          mkdir -p .github
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest_v4_release_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest_v4_release_run.txt
          git commit -m "ci: record latest V4 publishing package run [skip ci]"
          git push
