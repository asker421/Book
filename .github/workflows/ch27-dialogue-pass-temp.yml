name: Apply chapter 27 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch27-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact dialogue expansions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('chapters_v2/27-milliony-let.md')
          text = p.read_text(encoding='utf-8')
          repls = [
            (
              'Мара предупредила, что текущая география слишком далеко ушла от его карты и точку придётся восстанавливать через движение плит и изменение рельефа. Асгар попросил всё равно показать.',
              'Мара предупредила:\n\n— Текущая география слишком далеко ушла от вашей карты. Точку придётся восстанавливать через движение плит и изменение рельефа.\n\n— Всё равно покажи.'
            ),
            (
              'У открытой двери Мара сообщила, что окно выглядит устойчивым и далеко отходить не запрещено. Попросила только не есть местные растения и не касаться животных без необходимости. Асгар ответил, что после восемнадцати миллионов лет эволюции не собирается проверять совместимость зубами. Мара сухо заметила, что этот пункт инструкции хотя бы не пришлось повторять дважды. После напряжения орбитального инцидента их разговор впервые снова стал обычным. Асгар вернул трубку на рычаги и спустился по склону.',
              'У открытой двери Мара сообщила:\n\n— Окно выглядит устойчивым. Далеко отходить не запрещено.\n\n— Ограничения?\n\n— Не ешьте местные растения. Не касайтесь животных без необходимости.\n\n— После восемнадцати миллионов лет эволюции я не собираюсь проверять совместимость зубами.\n\n— Этот пункт хотя бы не пришлось повторять дважды.\n\nПосле напряжения орбитального инцидента их разговор впервые снова стал обычным. Асгар вернул трубку на рычаги и спустился по склону.'
            ),
            (
              'До дома Кирана они добрались не сразу. На середине маршрута локальный узел закрыл прямую трассу: через долину началась сезонная миграция крупного стада, и автоматический транспорт отказался пересекать её даже на малой высоте. Асгар предложил обойти животных по воздуху. Киран объяснил, что шум изменит направление стада и несколько недель работы биологов пойдут насмарку. Пришлось потратить лишние два часа на наземный объезд.',
              'До дома Кирана они добрались не сразу. На середине маршрута локальный узел закрыл прямую трассу: через долину началась сезонная миграция крупного стада, и автоматический транспорт отказался пересекать её даже на малой высоте.\n\n— Обойдём животных по воздуху.\n\n— Шум изменит направление стада. Несколько недель работы биологов пойдут насмарку.\n\nПришлось потратить лишние два часа на наземный объезд.'
            ),
            (
              'Транспорт предложил три варианта: длинный наземный, короткий высокий с ограничением по шуму и подземную линию, которую нужно было сначала проверить после недавнего обвала. Киран выбрал наземный. Асгар спросил, почему не подземный. Ответ был неожиданно знакомым: Киран хотел приехать сегодня, а не участвовать в отчёте о состоянии тоннеля. Миллионы лет цивилизации не уничтожили обычную человеческую лень перед лишней бюрократией.',
              'Транспорт предложил три варианта: длинный наземный, короткий высокий с ограничением по шуму и подземную линию, которую нужно было сначала проверить после недавнего обвала. Киран выбрал наземный.\n\n— Почему не подземный?\n\n— Я хочу приехать сегодня, а не участвовать в отчёте о состоянии тоннеля.\n\nМиллионы лет цивилизации не уничтожили обычную человеческую лень перед лишней бюрократией.'
            ),
            (
              'По дороге Киран дал Асгару безопасную пищу, собранную локальным медицинским устройством из простых молекулярных компонентов после сравнения биохимии. Вкус оказался разочаровывающе обычным — зерновое, солёное, немного жирное. Асгар сказал, что ожидал кухни восемнадцати миллионов лет. Киран ответил, что желудок человека после путешествия через эпохи не обязан участвовать в культурной программе. Потом всю дорогу ворчал, что в молодости маршрут был настроен лучше, и признался, что повторяет это каждый год.',
              'По дороге Киран дал Асгару безопасную пищу, собранную локальным медицинским устройством из простых молекулярных компонентов после сравнения биохимии. Вкус оказался разочаровывающе обычным — зерновое, солёное, немного жирное.\n\n— Я ожидал кухни восемнадцати миллионов лет.\n\n— Желудок человека после путешествия через эпохи не обязан участвовать в культурной программе.\n\nПотом Киран всю дорогу ворчал, что в молодости маршрут был настроен лучше, и признался, что повторяет это каждый год.'
            ),
            (
              'Киран рассказал, что когда-то пробовал ускоренное субъективное время: его биологическая непрерывность не прерывалась, но несколько собственных лет он провёл через вычислительную среду. Вернулся, потому что не нравилось постоянно обнаруживать: мир снаружи меняется быстрее эмоциональной связи с ним. Он не считал этот выбор морально правильным, просто личным. Асгар спросил, зачем тогда вообще оставаться на Земле, если можно жить где угодно. Киран ответил: ему нравится здесь сегодня. Не обязательно всю жизнь. Иногда он уезжает на несколько лет, потом возвращается и снова ворчит на транспорт.',
              'Киран рассказал:\n\n— Когда-то я пробовал ускоренное субъективное время. Биологическая непрерывность не прерывалась, но несколько собственных лет я провёл через вычислительную среду.\n\n— Почему вернулся?\n\n— Не нравилось постоянно обнаруживать: мир снаружи меняется быстрее эмоциональной связи с ним.\n\nОн не считал этот выбор морально правильным, просто личным.\n\n— Тогда зачем вообще оставаться на Земле, если можно жить где угодно?\n\n— Мне нравится здесь сегодня. Не обязательно всю жизнь. Иногда уезжаю на несколько лет, потом возвращаюсь и снова ворчу на транспорт.'
            ),
            (
              'В другой день они пошли к реке пешком. Киран несколько раз останавливался, пропуская местных животных. Никакой системы отпугивания не включалось. Асгар спросил, сколько удобства люди готовы отдать ради идеи «не быть центром». Киран ответил, что это не религиозный принцип. Если понадобится эвакуация, пожарная полоса или реальная угроза людям, животных отведут. Сегодня им просто никуда не нужно настолько срочно.',
              'В другой день они пошли к реке пешком. Киран несколько раз останавливался, пропуская местных животных. Никакой системы отпугивания не включалось.\n\n— Сколько удобства люди готовы отдать ради идеи «не быть центром»?\n\n— Это не религиозный принцип. Если понадобится эвакуация, пожарная полоса или реальная угроза людям, животных отведут.\n\n— А сегодня?\n\n— Сегодня нам просто никуда не нужно настолько срочно.'
            ),
            (
              'На пятый день Асгар снова приехал к будке вместе с Кираном. Телефон включился сам ещё до того, как они подошли вплотную. Мара сообщила, что следующее устойчивое состояние, вероятно, лежит значительно дальше предыдущего, а на части перехода внешний контакт может потеряться. Раньше Асгар после такой фразы первым делом требовал хотя бы приблизительную дату. Теперь он посмотрел на незнакомую реку, на Землю, которая уже один раз успела стереть его географию, и спросил иначе.',
              'На пятый день Асгар снова приехал к будке вместе с Кираном. Телефон включился сам ещё до того, как они подошли вплотную.\n\n— Следующее устойчивое состояние, вероятно, значительно дальше предыдущего, — сказала Мара. — На части перехода внешний контакт может потеряться.\n\nРаньше Асгар после такой фразы первым делом требовал хотя бы приблизительную дату. Теперь он посмотрел на незнакомую реку, на Землю, которая уже один раз успела стереть его географию, и спросил иначе.'
            ),
            (
              'Несколько секунд они стояли рядом с кабиной. Потом Киран вспомнил о старом наземном архиве, который упоминал раньше. Один из последних крупных архивов Земли мог сохранить гораздо более надёжную цепочку записей о красной конструкции, чем фрагменты, доступные здесь.\n\n— Далеко? — спросил Асгар.',
              'Несколько секунд они стояли рядом с кабиной. Потом Киран вернулся к старому наземному архиву, который уже упоминал раньше.\n\n— Один из последних крупных архивов Земли. Там могла сохраниться более надёжная цепочка записей о красной конструкции.\n\n— Далеко? — спросил Асгар.'
            ),
          ]

          for i, (old, new) in enumerate(repls, 1):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          print(f'Applied {len(repls)} dialogue expansions')
          PY
          git diff --check -- chapters_v2/27-milliony-let.md
          git diff -- chapters_v2/27-milliony-let.md
      - name: Commit chapter 27
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/27-milliony-let.md
          git commit -m "Expand folded dialogue in chapter 27"
          git push origin HEAD:main
