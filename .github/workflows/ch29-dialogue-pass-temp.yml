name: Apply chapter 29 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch29-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact dialogue expansions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chapters_v2/29-odin.md')
          text = p.read_text(encoding='utf-8')
          repls = [
            (
              'Через шесть дней после Последнего архива Земли Асгар вернулся к красной кабине. Она глубже входила в грунт, хотя земля вокруг не просела: изменилось само совпадение двух геометрий. Мара предупредила, что следующее устойчивое состояние может оказаться значительно дальше предыдущих и связь с линией на части перехода, вероятно, пропадёт. Киран выслушал перевод, посмотрел на Асгара и сказал, что после такой формулировки отпускать человека с одним мёртвым телефоном уже неприлично. Никакой сложной техники он, однако, не предложил. Активное устройство могло оказаться бесполезным или опасным в неизвестном окне, поэтому набор получился почти издевательски древним.',
              'Через шесть дней после Последнего архива Земли Асгар вернулся к красной кабине. Она глубже входила в грунт, хотя земля вокруг не просела: изменилось само совпадение двух геометрий. Мара предупредила:\n\n— Следующее устойчивое состояние может оказаться значительно дальше предыдущих. На части перехода связь с линией, вероятно, пропадёт.\n\nКиран выслушал перевод и посмотрел на Асгара.\n\n— После такой формулировки отпускать человека с одним мёртвым телефоном уже неприлично.\n\nНикакой сложной техники он, однако, не предложил. Активное устройство могло оказаться бесполезным или опасным в неизвестном окне, поэтому набор получился почти издевательски древним.'
            ),
            (
              'Потом Киран заставил Асгара несколько раз разложить всё на камне и собрать обратно. После третьего раза выключил освещение вокруг них. В полной темноте Асгар дважды перепутал шнур с ремнём сумки и уронил огниво. Смешного стало меньше. Киран сказал, что первая ночь в незнакомом мире может начаться раньше, чем человек поймёт, где находится вода, а потерянный в траве маленький металлический стержень не станет светиться только потому, что он очень нужен. На вопрос, не слишком ли Киран увлёкся подготовкой, тот ответил: Асгар сам собирается туда, где они не знают даже эпоху. Пусть хотя бы карманы будут предсказуемыми.',
              'Потом Киран заставил Асгара несколько раз разложить всё на камне и собрать обратно. После третьего раза выключил освещение вокруг них. В полной темноте Асгар дважды перепутал шнур с ремнём сумки и уронил огниво. Смешного стало меньше.\n\n— Первая ночь может начаться раньше, чем ты поймёшь, где вода. А потерянный в траве стержень не станет светиться только потому, что очень нужен.\n\n— Ты не слишком увлёкся подготовкой?\n\n— Ты сам собираешься туда, где мы не знаем даже эпоху. Пусть хотя бы карманы будут предсказуемыми.'
            ),
            (
              'Перед входом Асгар пересчитал вещи и массу. Киран спросил, ничего ли они не забыли. Асгар посмотрел на сумку. Киран ответил за него: всё, чего нельзя предсказать. Никаких обещаний увидеться снова они не давали. Асгар вошёл, добровольно подтвердил продолжение, закрыл дверь только после разрешения Мары, и Земля 18 403 221 года исчезла.',
              'Перед входом Асгар пересчитал вещи и массу.\n\n— Ничего не забыли?\n\nАсгар посмотрел на сумку.\n\n— Всё, чего нельзя предсказать, — ответил Киран за него.\n\nНикаких обещаний увидеться снова они не давали. Асгар вошёл, добровольно подтвердил продолжение, закрыл дверь только после разрешения Мары, и Земля 18 403 221 года исчезла.'
            ),
            (
              'Мара вышла на связь один раз, и её голос прозвучал так, будто между последним разговором и этим прошло гораздо больше времени, чем для Асгара. После короткой сверки она первым делом назвала привязку: шестьдесят один миллион восемьдесят четыре тысячи семьсот семьдесят третий год. Только потом сообщила, что будка здесь держится плохо и скоро должна исчезнуть. Когда появится снова — неизвестно. Пассажирская связь сохраняется и по-прежнему ограничивает область допустимых состояний, но не делает Асгара точным маяком. Следующее окно, если сформируется, будет связано с его причинной областью, однако это может означать километры и неизвестный срок. На вопрос «дни или годы?» Мара ответила: возможно и то и другое.',
              'Мара вышла на связь один раз, и её голос прозвучал так, будто между последним разговором и этим прошло гораздо больше времени, чем для Асгара. После короткой сверки она сказала:\n\n— Привязка: шестьдесят один миллион восемьдесят четыре тысячи семьсот семьдесят третий год.\n\n— Что с окном?\n\n— Будка здесь держится плохо. Скоро должна исчезнуть.\n\n— Когда появится снова?\n\n— Не знаю. Пассажирская связь сохраняется и по-прежнему ограничивает область допустимых состояний. Но точным маяком вас не делает. Следующее окно будет связано с вашей причинной областью. Это может означать километры и неизвестный срок.\n\n— Дни или годы?\n\n— Возможно и то и другое.'
            ),
            (
              'Асгар сразу проверил всё, что могло дать хотя бы иллюзию контроля. Вызвать кабину обратно сигналом нельзя. Оставить маяк — бессмысленно. Проследить направление исчезновения — нечего отслеживать. Предсказать момент нового окна служба не умеет. На вопрос о разумной жизни панель подтвердила атмосферу, воду, крупную биологическую активность и несколько слабых орбитальных следов, которые могли быть древними искусственными объектами или шумом. Надёжного современного техносигнала не было. Мара сказала это как информацию, а не предупреждение, и Асгар неожиданно сорвался именно на спокойный тон.',
              'Асгар сразу проверил всё, что могло дать хотя бы иллюзию контроля.\n\n— Вызвать кабину обратно сигналом?\n\n— Нельзя.\n\n— Оставить маяк?\n\n— Бессмысленно.\n\n— Проследить направление исчезновения?\n\n— Нечего отслеживать.\n\n— Предсказать новое окно?\n\n— Не умеем.\n\nНа вопрос о разумной жизни панель подтвердила атмосферу, воду, крупную биологическую активность и несколько слабых орбитальных следов, которые могли быть древними искусственными объектами или шумом. Надёжного современного техносигнала не было. Мара сказала это как информацию, а не предупреждение, и Асгар неожиданно сорвался именно на спокойный тон.'
            ),
            (
              'Он спросил, зачем вообще идти к источнику, если машина может бросить живого человека на пустой планете на неопределённый срок. Мара не попыталась защищать маршрут. Текущее состояние не выбрано службой; срок отсутствия окна неизвестен; обещать обратное она не может. Асгар выругался, замолчал, а через минуту извинился. Мара ответила, что извинение не требуется. В голосе слышалась усталость, но он не спросил, сколько времени прошло для неё. Через несколько минут связь оборвалась.',
              '— Тогда зачем вообще идти к источнику, если машина может бросить живого человека на пустой планете на неопределённый срок?\n\nМара не попыталась защищать маршрут.\n\n— Текущее состояние не выбрано службой. Срок отсутствия окна неизвестен. Обещать обратное я не могу.\n\nАсгар выругался и замолчал. Через минуту сказал:\n\n— Извини.\n\n— Извинение не требуется.\n\nВ голосе слышалась усталость, но он не спросил, сколько времени прошло для неё. Через несколько минут связь оборвалась.'
            ),
          ]
          for i, (old, new) in enumerate(repls, 1):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          print(f'Applied {len(repls)} dialogue expansions')
          PY
          git diff --check -- chapters_v2/29-odin.md
      - name: Commit chapter 29
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/29-odin.md
          git commit -m "Expand folded dialogue in chapter 29"
          git push origin HEAD:main
