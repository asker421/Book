name: Count Frozen V2 Words

on:
  push:
    paths:
      - '.github/workflows/count_frozen_v2_words.yml'

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count exact frozen source
        run: |
          rm -rf /tmp/frozen-v2
          mkdir -p /tmp/frozen-v2
          git archive 5e0a4e0f956c280458fa6a511799a6601a233978 chapters_v2 | tar -x -C /tmp/frozen-v2
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/frozen-v2/chapters_v2')
          rows=[]
          for p in sorted(root.glob('*.md')):
              text=p.read_text(encoding='utf-8')
              title=re.search(r'^#+\s+(.+)$',text,re.M)
              title=title.group(1).strip() if title else p.stem
              words=re.findall(r"[A-Za-zА-Яа-яЁё0-9]+(?:[-‑–][A-Za-zА-Яа-яЁё0-9]+)*", text)
              rows.append((p.name,title,len(words)))
          total=sum(n for _,_,n in rows)
          print('FROZEN_SHA 5e0a4e0f956c280458fa6a511799a6601a233978')
          for f,t,n in rows:
              print(f'{f}\t{t}\t{n}')
          print('TOTAL\t'+str(total))
          PY
