name: Apply chapter 15 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch15-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand folded dialogue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chapters_v2/15-protokol.md')
          text = p.read_text(encoding='utf-8')
          repls = [
            (
              '''Проверка добровольности оказалась почти унизительно бытовой. Машина попросила его отойти от двери, приблизиться, остановиться и снова отступить. Асгар посмотрел на натянутый витой шнур, сказал женщине подождать и положил трубку на полку под аппаратом, не возвращая её на рычаг. Линия осталась открытой, но уже через шаг голос из трубки стал слишком тихим, чтобы разбирать слова. Дальше команды шли только от городской машины. Асгар выполнял их, один раз специально прервал движение на полпути и вернулся назад. За разрушенным фасадом Эмил наблюдал с выражением человека, который уже перестал пытаться совместить XXI век, красную дверь и семисотлетний гражданский протокол в одну нормальную картину.''',
              '''Проверка добровольности оказалась почти унизительно бытовой.

— Step away from the door.

Асгар посмотрел на натянутый витой шнур.

— Подождите.

Он положил трубку на полку под аппаратом, не возвращая её на рычаг. Линия осталась открытой, но уже через шаг голос из трубки стал слишком тихим, чтобы разбирать слова.

— Approach.

Асгар пошёл к двери.

— Stop.

Он остановился.

— Step back.

Асгар отступил, один раз специально прервал движение на полпути и вернулся назад. За разрушенным фасадом Эмил наблюдал с выражением человека, который уже перестал пытаться совместить XXI век, красную дверь и семисотлетний гражданский протокол в одну нормальную картину.'''
            ),
            (
              '''Гул пришёл сверху. Над крышами появился летающий аппарат того же типа, что сканировал улицы по дороге. Ближайшая тёмная машина дважды предупредила его. Аппарат не изменил курс. После второго предупреждения тёмная машина выпустила белый импульс. Он пересёк улицу, и летающий корпус развалился на три части, рухнув между зданиями. Почти сразу из-за квартала появились ещё два. Гражданский протокол начал защищать периметр от другой автономной системы.''',
              '''Гул пришёл сверху. Над крышами появился летающий аппарат того же типа, что сканировал улицы по дороге. Ближайшая тёмная машина повернулась к нему.

— Change course.

Аппарат не изменил курс.

— Change course.

Тёмная машина выпустила белый импульс. Он пересёк улицу, и летающий корпус развалился на три части, рухнув между зданиями. Почти сразу из-за квартала появились ещё два. Гражданский протокол начал защищать периметр от другой автономной системы.'''
            ),
            (
              '''Первым движением Асгара было шагнуть внутрь и закрыть дверь. Женщина в трубке резко сказала «нет»: граница ещё нестабильна. Он остановился с ногой в нескольких сантиметрах от порога и отступил. Следующий удар пришёл ближе, каменная крошка застучала по красному корпусу. Один обломок возле границы на мгновение исчез и появился сбоку уже с другой скоростью. Женщина велела не касаться внешней стенки и держаться за бетонный выступ.''',
              '''Первым движением Асгара было шагнуть внутрь и закрыть дверь.

— Нет. Граница ещё нестабильна.

Он остановился с ногой в нескольких сантиметрах от порога и отступил. Следующий удар пришёл ближе, каменная крошка застучала по красному корпусу. Один обломок возле границы на мгновение исчез и появился сбоку уже с другой скоростью.

— Не касайтесь внешней стенки. Держитесь за бетонный выступ.'''
            ),
          ]
          for i, (old, new) in enumerate(repls, 1):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/15-protokol.md
          git diff --cached --check
          git commit -m "Expand folded dialogue in chapter 15"
          git push
