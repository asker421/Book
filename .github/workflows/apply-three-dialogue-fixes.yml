name: Apply three dialogue pacing fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-three-dialogue-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p8 = Path('chapters_v2/08-vtoroe-okno.md')
          s8 = p8.read_text(encoding='utf-8')

          old1 = '''Младший согласился на короткий голосовой звон без видео. Асгар услышал взрослый мужской голос и сначала не понял, что это его ребёнок. Они сказали друг другу по нескольку фраз, почти бессмысленных: «как ты», «нормально», «это правда ты». Потом оба замолчали. Асгар не стал вытягивать разговор. В конце сын сказал: «Мама потом объяснит, где встретимся». После отключения Асгар понял, что хотел этой минуты больше всего на свете и одновременно совершенно не знал, что с ней делать. Катя рассказала, что дети знают о возвращении, но один пока не готов приехать, а второй попросил сначала поговорить с ней наедине. Асгар почувствовал укол — хотелось немедленной встречи, доказательства, что семья существует. Катя заметила и сказала: «Не обижайся на них за то, что они не умеют реагировать на воскресшего отца правильно». Формулировка была жёсткой, но точной.'''

          new1 = '''Младший согласился на короткий голосовой звон без видео.

          Асгар услышал взрослый мужской голос и сначала не понял, что это его ребёнок.

          — Как ты?

          — Нормально.

          Пауза.

          — Это правда ты?

          — Правда.

          Оба замолчали. Асгар не стал вытягивать разговор.

          — Мама потом объяснит, где встретимся.

          После отключения Асгар понял, что хотел этой минуты больше всего на свете и одновременно совершенно не знал, что с ней делать.

          Катя рассказала, что дети знают о возвращении, но один пока не готов приехать, а второй попросил сначала поговорить с ней наедине. Асгар почувствовал укол — хотелось немедленной встречи, доказательства, что семья существует.

          — Не обижайся на них за то, что они не умеют реагировать на воскресшего отца правильно.

          Формулировка была жёсткой, но точной.'''

          old2 = '''Асгар положил трубку на полку у аппарата и подошёл к Кате. Между ними оставалась прозрачная панель. Она подняла ладонь к стеклу, он приложил свою с другой стороны. Катя сказала, что он может остаться и что она сама хочет этого; если уйдёт, она будет злиться. Но оставаться только потому, что она ждала двадцать пять лет, он не должен. Фраза была болезненной именно потому, что снимала последнюю возможность переложить решение на её ожидание.'''

          new2 = '''Асгар положил трубку на полку у аппарата и подошёл к Кате. Между ними оставалась прозрачная панель. Она подняла ладонь к стеклу, он приложил свою с другой стороны.

          — Ты можешь остаться.

          — Ты этого хочешь?

          — Хочу. Если уйдёшь, я буду злиться.

          Асгар не отнял ладонь.

          — Тогда я останусь.

          — Нет. Не потому, что я ждала двадцать пять лет.

          Это снимало последнюю возможность переложить решение на её ожидание.'''

          for old, new, label in [(old1, new1, 'chapter 8 / son call'), (old2, new2, 'chapter 8 / glass')]:
              count = s8.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s8 = s8.replace(old, new, 1)

          p8.write_text(s8, encoding='utf-8')

          p37 = Path('chapters_v2/37-vy-pochti-doshli.md')
          s37 = p37.read_text(encoding='utf-8')

          old3 = '''Предел сообщил, что устойчивость следующего состояния достигла требуемого диапазона. Асгар проверил воду, одежду, ленту, дверь и внешнее поле. Всё было готово. Голос Мары ещё сохранялся, но задержка продолжала расти. Он сказал: «Тогда до связи». Ответ появился почти на пределе слышимости: «До связи, Асгар». Несколько секунд в трубке оставался шум, затем пришёл короткий служебный тон. Больше ничего. Предел подтвердил штатное закрытие внешнего голосового канала. Асгар не попросил делать локальную копию разговора: если исходная линия ещё цела, запись уже существует; если нет, случайный дубль здесь ничего не исправит.'''

          new3 = '''Предел сообщил, что устойчивость следующего состояния достигла требуемого диапазона. Асгар проверил воду, одежду, ленту, дверь и внешнее поле. Всё было готово.

          Голос Мары ещё сохранялся, но задержка продолжала расти.

          — Тогда до связи.

          Ответ пришёл почти на пределе слышимости.

          — До связи, Асгар.

          Несколько секунд в трубке оставался шум. Потом короткий служебный тон.

          Больше ничего.

          Предел подтвердил штатное закрытие внешнего голосового канала. Асгар не попросил делать локальную копию разговора: если исходная линия ещё цела, запись уже существует; если нет, случайный дубль здесь ничего не исправит.'''

          count = s37.count(old3)
          if count != 1:
              raise SystemExit(f'chapter 37 / farewell: expected exactly 1 match, found {count}')
          s37 = s37.replace(old3, new3, 1)
          p37.write_text(s37, encoding='utf-8')
          PY

      - name: Verify only intended chapter files changed
        shell: bash
        run: |
          changed=$(git diff --name-only)
          echo "$changed"
          test "$changed" = $'chapters_v2/08-vtoroe-okno.md\nchapters_v2/37-vy-pochti-doshli.md'

      - name: Commit source fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-three-dialogue-fixes.yml
          git add chapters_v2/08-vtoroe-okno.md chapters_v2/37-vy-pochti-doshli.md .github/workflows/apply-three-dialogue-fixes.yml
          git commit -m 'Apply three dialogue pacing fixes'
          git push origin HEAD:main
