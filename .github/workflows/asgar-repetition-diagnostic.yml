name: Asgar Repetition Diagnostic

on:
  push:
    branches:
      - asgar-repetition-pass-work
    paths:
      - '.github/workflows/asgar-repetition-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan chapters_v2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('chapters_v2')
          files = sorted(root.glob('*.md'))
          total = 0
          print('=== ASGAR TOTALS ===')
          for p in files:
              text = p.read_text(encoding='utf-8')
              n = text.count('Асгар')
              total += n
              print(f'{p.name}\t{n}')
          print(f'TOTAL\t{total}')

          print('\n=== CROSS-PARAGRAPH / ADJACENT-SENTENCE WINDOWS ===')
          target = re.compile(r'Асгар(?: снова)? (?:посмотрел|спросил|кивнул|повернулся)')
          sentence_re = re.compile(r'[^.!?…\n]+(?:[.!?…]+|$)', re.M)
          for p in files:
              text = p.read_text(encoding='utf-8')
              sentences = [m.group(0).strip() for m in sentence_re.finditer(text) if m.group(0).strip()]
              emitted = set()
              for i, sent in enumerate(sentences):
                  lo = max(0, i - 1)
                  hi = min(len(sentences), i + 3)
                  window = sentences[lo:hi]
                  joined = ' '.join(window)
                  has_near = sum(s.count('Асгар') for s in sentences[i:min(len(sentences), i+3)]) >= 2
                  has_special = bool(target.search(sent))
                  if (has_near or has_special) and (lo, hi) not in emitted:
                      emitted.add((lo, hi))
                      print(f'--- {p.name} :: S{i+1} :: near={int(has_near)} special={int(has_special)}')
                      print(joined)
          PY
