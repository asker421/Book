name: Apply chapter 26 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch26-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact dialogue expansions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chapters_v2/26-orbitalnaya-ohota.md')
          text = p.read_text(encoding='utf-8')
          repls = [
            (
              'Мара попросила пока не касаться внешнего шлюза. Станция ещё решала, как классифицировать атмосферу будки и человека внутри, поэтому вокруг технической секции формировался отдельный совместимый объём. Асгар спросил, нельзя ли просто оставить дверь закрытой и ждать. Можно, но красный объект уже заметили несколько внешних систем. На панели появлялись запросы на измерение, медицинскую помощь, физический доступ и перенос объекта в защищённую область. То, что никто пока не приближался, означало не спокойствие, а работу протоколов.',
              'Мара попросила:\n\n— Пока не касайтесь внешнего шлюза. Станция ещё решает, как классифицировать атмосферу будки и человека внутри.\n\nВокруг технической секции формировался отдельный совместимый объём.\n\n— А если просто оставить дверь закрытой и ждать?\n\n— Можно. Но красный объект уже заметили несколько внешних систем.\n\nНа панели появлялись запросы на измерение, медицинскую помощь, физический доступ и перенос объекта в защищённую область. То, что никто пока не приближался, означало не спокойствие, а работу протоколов.'
            ),
            (
              'Асгар посмотрел на три объекта и заметил, что Варн, значит, тоже «главный не везде». Координатор ответил, что главный ровно на том куске металла, где они стоят. Иногда этого достаточно. Сегодня, похоже, нет.',
              'Асгар посмотрел на три объекта.\n\n— Значит, вы тоже главный не везде.\n\n— Главный ровно на том куске металла, где мы стоим. Иногда этого достаточно. Сегодня, похоже, нет.'
            ),
            (
              'Третий вариант состоял в бездействии и надежде, что архивный аппарат остановится после новых подтверждений. Асгар спросил, что безопаснее. Варн не стал изображать уверенность: у каждого варианта неизвестный риск, именно поэтому переговоры уже превратились в аварию. Мара предложила ориентироваться не на сохранность машины и не на политические права, а на жизнь пассажира. Если внешний аппарат приблизится и включит стабилизирующее поле, реакция неизвестна. Медленное перемещение сегмента без активного воздействия, по доступным моделям, выглядело меньшим риском.',
              'Третий вариант состоял в бездействии и надежде, что архивный аппарат остановится после новых подтверждений.\n\n— Что безопаснее?\n\n— Не знаю, — ответил Варн. — У каждого варианта неизвестный риск. Поэтому переговоры уже превратились в аварию.\n\nМара вмешалась:\n\n— Ориентируйтесь на жизнь пассажира. Если внешний аппарат приблизится и включит стабилизирующее поле, реакция неизвестна. Медленное перемещение сегмента без активного воздействия выглядит меньшим риском.'
            ),
            (
              'Асгар спросил, можно ли просто уничтожить аппарат. Варн ответил, что физическая защита сегмента это позволяет, но разрушение рядом с неизвестной временной границей создаст облако обломков и энергии. Кроме того, сохранитель не был агрессором в обычном смысле — он выполнял плохо подходящую задачу. Уничтожать систему за буквальное исполнение слишком широкого мандата было крайней мерой.',
              '— Его можно просто уничтожить?\n\n— Защита сегмента позволяет. Но разрушение рядом с неизвестной временной границей создаст облако обломков и энергии.\n\nВарн посмотрел на сохранитель.\n\n— И он не агрессор в обычном смысле. Он выполняет плохо подходящую задачу. Уничтожать систему за буквальное исполнение слишком широкого мандата — крайняя мера.'
            ),
            (
              'Если будка уйдёт сейчас, сохранитель потеряет цель и, вероятно, прекратит сближение. Но никто не гарантировал, что его поле не включится в момент формирования. Асгар спросил, можно ли войти и закрыть дверь заранее. Мара ответила отрицательно: переход ещё не готов, а преждевременное замыкание внутреннего объёма способно создать новый класс ошибки. Он уже слишком хорошо понимал, почему «просто закрыть дверь» нельзя считать нейтральным действием.',
              'Если будка уйдёт сейчас, сохранитель потеряет цель и, вероятно, прекратит сближение. Но никто не гарантировал, что его поле не включится в момент формирования.\n\n— Я могу войти и закрыть дверь заранее?\n\n— Нет. Переход ещё не готов. Преждевременное замыкание внутреннего объёма способно создать новый класс ошибки.\n\nОн уже слишком хорошо понимал, почему «просто закрыть дверь» нельзя считать нейтральным действием.'
            ),
          ]
          for i, (old, new) in enumerate(repls, 1):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          print(f'Applied {len(repls)} dialogue expansions')
          PY
          git diff --check -- chapters_v2/26-orbitalnaya-ohota.md
      - name: Commit chapter 26
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/26-orbitalnaya-ohota.md
          git commit -m "Expand folded dialogue in chapter 26"
          git push origin HEAD:main
