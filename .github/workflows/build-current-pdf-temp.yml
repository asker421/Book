name: Build current PDF artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-current-pdf-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Build PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html
          from reportlab.lib.pagesizes import inch
          from reportlab.lib.enums import TA_CENTER, TA_JUSTIFY
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, PageBreak

          out = Path('dist')
          out.mkdir(exist_ok=True)
          pdf_path = out / 'Krasnaya_budka_Asker_Ismayilov_CURRENT_MAIN.pdf'

          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf'
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf'
          pdfmetrics.registerFont(TTFont('BookSerif', regular))
          pdfmetrics.registerFont(TTFont('BookSerifBold', bold))

          PAGE = (5*inch, 8*inch)
          doc = SimpleDocTemplate(
              str(pdf_path), pagesize=PAGE,
              leftMargin=15*mm, rightMargin=15*mm,
              topMargin=17*mm, bottomMargin=15*mm,
              title='Красная будка', author='Аскер Исмайлов'
          )

          body = ParagraphStyle(
              'Body', fontName='BookSerif', fontSize=9.2, leading=13.2,
              alignment=TA_JUSTIFY, firstLineIndent=5*mm,
              spaceBefore=0, spaceAfter=2.6*mm,
              allowWidows=0, allowOrphans=0,
          )
          dialogue = ParagraphStyle(
              'Dialogue', parent=body, firstLineIndent=0,
          )
          chapter = ParagraphStyle(
              'Chapter', fontName='BookSerifBold', fontSize=16, leading=20,
              alignment=TA_CENTER, spaceAfter=12*mm, spaceBefore=20*mm,
          )
          title = ParagraphStyle(
              'Title', fontName='BookSerifBold', fontSize=26, leading=31,
              alignment=TA_CENTER, spaceAfter=8*mm,
          )
          author = ParagraphStyle(
              'Author', fontName='BookSerif', fontSize=12, leading=16,
              alignment=TA_CENTER,
          )
          preface_head = ParagraphStyle(
              'PrefaceHead', fontName='BookSerifBold', fontSize=14, leading=18,
              alignment=TA_CENTER, spaceAfter=10*mm,
          )
          preface_body = ParagraphStyle(
              'PrefaceBody', parent=body, firstLineIndent=0,
          )

          def clean_inline(s: str) -> str:
              s = html.escape(s, quote=False)
              s = re.sub(r'\*\*(.+?)\*\*', r'<b>\1</b>', s)
              s = re.sub(r'(?<!\*)\*(.+?)\*(?!\*)', r'<i>\1</i>', s)
              return s

          def page_num(canvas, doc):
              n = canvas.getPageNumber()
              if n > 2:
                  canvas.saveState()
                  canvas.setFont('BookSerif', 7.5)
                  canvas.drawCentredString(PAGE[0]/2, 7*mm, str(n-2))
                  canvas.restoreState()

          story = []
          story += [Spacer(1, 42*mm), Paragraph('КРАСНАЯ БУДКА', title), Paragraph('Аскер Исмайлов', author), PageBreak()]
          story += [Spacer(1, 12*mm), Paragraph('Вступление', preface_head)]
          preface = [
              'Есть вещи, которые мы замечаем только один раз.',
              'Дверь в незнакомом доме. Лицо в толпе. Телефонный звонок, на который можно было не ответить. Несколько секунд, после которых жизнь продолжает идти точно так же — пока однажды не выясняется, что именно в эти секунды она свернула совсем не туда.',
              'Мы привыкли думать о времени как о дороге. Прошлое остаётся позади, будущее ждёт впереди, а настоящее — единственное место, где мы действительно существуем.',
              'Это удобная мысль.',
              'Возможно, даже необходимая.',
              'Потому что если время устроено иначе, если прожитое никуда не исчезает, если каждый наш шаг остаётся где-то таким же настоящим, как эта страница сейчас, — тогда самый страшный вопрос звучит не так:',
              '<b>можно ли вернуться назад?</b>',
              'А так:',
              '<b>что ты сделаешь, если однажды тебе действительно позволят?</b>',
          ]
          for p in preface:
              story.append(Paragraph(p, preface_body))
          story.append(PageBreak())

          files = sorted(Path('chapters_v2').glob('*.md'))
          assert len(files) == 45, len(files)
          for idx, path in enumerate(files):
              txt = path.read_text(encoding='utf-8').replace('\r\n','\n').strip()
              blocks = re.split(r'\n\s*\n', txt)
              if not blocks:
                  continue
              heading = blocks[0].strip()
              if heading.startswith('#'):
                  heading = heading.lstrip('#').strip()
              if idx:
                  story.append(PageBreak())
              story.append(Paragraph(clean_inline(heading), chapter))
              for block in blocks[1:]:
                  b = block.strip()
                  if not b:
                      continue
                  # Preserve deliberate hard line breaks inside a block.
                  lines = [ln.strip() for ln in b.split('\n') if ln.strip()]
                  if len(lines) > 1 and all(ln.startswith('—') for ln in lines):
                      for ln in lines:
                          story.append(Paragraph(clean_inline(ln), dialogue))
                      continue
                  text = ' '.join(lines)
                  st = dialogue if text.startswith('—') else body
                  story.append(Paragraph(clean_inline(text), st))

          doc.build(story, onFirstPage=page_num, onLaterPages=page_num)
          print(pdf_path)
          PY
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-budka-current-main-pdf
          path: dist/Krasnaya_budka_Asker_Ismayilov_CURRENT_MAIN.pdf
          if-no-files-found: error
      - name: Record PDF run id
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest_pdf_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest_pdf_run.txt
          git commit -m "ci: record latest PDF artifact run [skip ci]"
          git push
