name: Freeze V2 EPUB

on:
  push:
    paths:
      - '.github/workflows/freeze_v2_epub.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact frozen source
        run: |
          rm -rf /tmp/krasnaya_v2
          mkdir -p /tmp/krasnaya_v2
          git archive 5e0a4e0f956c280458fa6a511799a6601a233978 chapters_v2 assets/cover_epub.b64 | tar -x -C /tmp/krasnaya_v2

      - name: Install EPUB builder
        run: python -m pip install --quiet ebooklib markdown

      - name: Build frozen EPUB
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, zipfile
          import markdown
          from ebooklib import epub

          ROOT = Path('/tmp/krasnaya_v2')
          FROZEN_SHA = '5e0a4e0f956c280458fa6a511799a6601a233978'
          files = sorted((ROOT / 'chapters_v2').glob('*.md'))
          if len(files) != 45:
              raise SystemExit(f'Expected 45 sections, got {len(files)}')

          outdir = Path('release')
          outdir.mkdir(exist_ok=True)
          out = outdir / 'krasnaya-budka-v2-FROZEN.epub'

          book = epub.EpubBook()
          book.set_identifier('krasnaya-budka-v2-frozen-' + FROZEN_SHA[:12])
          book.set_title('Красная будка')
          book.set_language('ru')
          book.add_metadata('DC', 'description', 'Замороженная редакция V2 романа «Красная будка».')
          book.add_metadata('DC', 'source', FROZEN_SHA)

          cover = base64.b64decode((ROOT / 'assets/cover_epub.b64').read_text(encoding='utf-8').strip())
          if cover.startswith(b'\x89PNG\r\n\x1a\n'):
              cover_name = 'cover.png'
          elif cover.startswith(b'\xff\xd8\xff'):
              cover_name = 'cover.jpg'
          else:
              raise SystemExit('Unknown cover format')
          book.set_cover(cover_name, cover)

          css_text = '''
          body { font-family: serif; line-height: 1.48; margin: 5%; }
          h1 { text-align: center; margin: 1.8em 0 1.3em; page-break-before: always; }
          p { text-indent: 1.2em; margin: 0.35em 0; }
          h1 + p { text-indent: 0; }
          '''
          css = epub.EpubItem(uid='novel_css', file_name='style/novel.css', media_type='text/css', content=css_text)
          book.add_item(css)

          sections = []
          for i, path in enumerate(files, 1):
              src = path.read_text(encoding='utf-8').strip()
              m = re.search(r'^#+\s+(.+)$', src, flags=re.M)
              if not m:
                  raise SystemExit(f'No heading in {path.name}')
              title = m.group(1).strip()
              html = markdown.markdown(src, extensions=['extra', 'smarty'])
              ch = epub.EpubHtml(title=title, file_name=f'section_{i:02d}.xhtml', lang='ru')
              ch.content = html
              ch.add_item(css)
              book.add_item(ch)
              sections.append(ch)

          book.toc = tuple(sections)
          book.spine = ['nav'] + sections
          book.add_item(epub.EpubNcx())
          book.add_item(epub.EpubNav())
          epub.write_epub(str(out), book, {'epub_version': 3})

          with zipfile.ZipFile(out, 'r') as z:
              names = z.namelist()
              if not names or names[0] != 'mimetype':
                  raise SystemExit('Invalid EPUB: mimetype is not first')
              section_docs = [n for n in names if n.endswith('.xhtml') and 'section_' in n]
              if len(section_docs) != 45:
                  raise SystemExit(f'Invalid EPUB: expected 45 section docs, got {len(section_docs)}')
              if 'META-INF/container.xml' not in names:
                  raise SystemExit('Invalid EPUB: missing META-INF/container.xml')

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          freeze = f'''# Красная будка — FROZEN V2

**Status: FROZEN / IMMUTABLE LITERARY RELEASE**

- Frozen source corpus: `chapters_v2/`
- Exact literary source commit: `{FROZEN_SHA}`
- Sections: `45` (40 глав + 5 интерлюдий)
- Frozen EPUB: `release/krasnaya-budka-v2-FROZEN.epub`
- EPUB SHA256: `{digest}`

## Правило после freeze

`chapters_v2/` больше не редактируется литературно и считается неизменяемой замороженной редакцией.

Если после freeze потребуется хоть одна новая литературная правка, сначала создаётся `chapters_v3/` как копия frozen V2, и все изменения выполняются только в `chapters_v3/`.

Допустимы только служебные файлы вокруг V2 (release metadata, checksum, documentation), не меняющие текст `chapters_v2/`.
'''
          Path('FROZEN_V2.md').write_text(freeze, encoding='utf-8')
          Path('release/krasnaya-budka-v2-FROZEN.sha256').write_text(f'{digest}  krasnaya-budka-v2-FROZEN.epub\n', encoding='utf-8')
          print('EPUB:', out)
          print('SHA256:', digest)
          PY

      - name: Commit frozen release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FROZEN_V2.md release/krasnaya-budka-v2-FROZEN.epub release/krasnaya-budka-v2-FROZEN.sha256
          git commit -m "release: freeze v2 and add frozen EPUB"
          git push
