name: Apply chapter 12 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch12-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand folded dialogue
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p = Path('chapters_v2/12-shturm.md')
          text = p.read_text(encoding='utf-8')
          pairs = [
            ('', ''),
            ('', ''),
            ('', ''),
          ]
          for i, (a64, b64) in enumerate(pairs, 1):
              old = base64.b64decode(a64).decode('utf-8')
              new = base64.b64decode(b64).decode('utf-8')
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/12-shturm.md
          git diff --cached --check
          git commit -m "Expand folded dialogue in chapter 12"
          git push
