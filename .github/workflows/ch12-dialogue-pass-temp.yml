name: Apply chapter 12 dialogue pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch12-dialogue-pass-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand folded dialogue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chapters_v2/12-shturm.md')
          text = p.read_text(encoding='utf-8')
          repls = [
            (
              '''Самир приехал вместе с женщиной из службы пространственной безопасности. Её звали Лейла Гасанова. На форме не было оружия и привычной аварийной символики — только тонкая маркировка подразделения и рабочий интерфейс на предплечье. Она не спросила, «что это за будка». Первым вопросом было другое: есть ли у Асгара основания считать объект опасным именно сейчас, а не вообще. Он перечислил только подтверждённое собственным опытом: рядом с предыдущими появлениями расходились часы, геометрические измерения переставали совпадать, а в 2014 году металлический штатив потерял часть ножки без обычного механического повреждения.

Лейла коротко пересказала план. Сначала вывести людей. Затем перевести соседние системы в локальный режим, чтобы одна ошибочная координата не заставила весь сектор выполнять неправильные команды. Только после этого — пассивные измерения. Она показала схему лёгких дистанционных стоек, которыми служба собиралась отметить положение предполагаемой границы. Асгар сразу остановил её на слове «граница». Стойки не должны касаться корпуса, объяснила Лейла, только фиксировать расстояние с разных направлений. Он ответил, что возле будки два хороших прибора могут не соглашаться даже о том, где находится одна и та же точка. После напоминания Самира про укороченный штатив механическую фиксацию убрали из первого плана.''',
              '''Самир приехал вместе с женщиной из службы пространственной безопасности. Её звали Лейла Гасанова. На форме не было оружия и привычной аварийной символики — только тонкая маркировка подразделения и рабочий интерфейс на предплечье.

— Есть основания считать объект опасным именно сейчас?

— Да. Рядом с предыдущими появлениями расходились часы. Геометрические измерения переставали совпадать. В 2014-м металлический штатив потерял часть ножки без обычного механического повреждения.

Лейла открыла схему.

— Сначала выводим людей. Потом переводим соседние системы в локальный режим. Только после этого — пассивные измерения.

Она показала лёгкие дистанционные стойки.

— Ими отметим границу.

— Границу?

— Корпуса они не касаются. Только фиксируют расстояние с разных направлений.

— Возле будки два хороших прибора могут не соглашаться даже о том, где одна и та же точка.

Самир напомнил про укороченный штатив. Механическую фиксацию убрали из первого плана.'''
            ),
            (
              '''Женский голос спросил первым, находится ли он внутри. Асгар ответил: нет. Она велела пока не входить и не позволять удерживать корпус снаружи. Он сказал, что до этого уже догадались, затем спросил, сколько объект будет оставаться в секторе. Женщина не знала. Куда уйдёт дальше — тоже.''',
              '''— Вы внутри? — спросил женский голос.

— Нет.

— Пока не входите. И не позволяйте удерживать корпус снаружи.

— До этого уже догадались. Сколько объект останется здесь?

— Не знаю.

— Куда уйдёт дальше?

— Не знаю.'''
            ),
            (
              '''Он спросил, есть ли причина входить сейчас, а не через десять минут. Женщина назвала только одну: ошибка продолжает расти. Самир вышел на связь и напомнил, что после прошлых входов внешняя среда быстро успокаивалась, но причинность этого никто не доказал.''',
              '''— Есть причина входить сейчас, а не через десять минут?

— Только одна. Ошибка продолжает расти.

Самир вышел на связь.

— После прошлых входов внешняя среда быстро успокаивалась. Но причинность никто не доказал.'''
            ),
          ]
          for i, (old, new) in enumerate(repls, 1):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'replacement {i}: expected 1 match, got {n}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/12-shturm.md
          git diff --cached --check
          git commit -m "Expand folded dialogue in chapter 12"
          git push
