          changed = []
          applied = 0
          for filename, replacements in edits.items():
              p = root / filename
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  n = text.count(old)
                  if n != 1:
                      raise RuntimeError(f'{filename}: expected exactly one occurrence, found {n}: {old!r}')
                  text = text.replace(old, new, 1)
                  applied += 1
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(filename)

          after = sum(p.read_text(encoding='utf-8').count('Асгар') for p in files)
          print(f'BEFORE={before}')
          print(f'AFTER={after}')
          print(f'REDUCED={before-after}')
          print(f'EDIT_OPERATIONS={applied}')
          print(f'CHANGED_FILES={len(changed)}')
          print('FILES=' + ','.join(changed))

          # Guard against accidental edits outside the intended corpus.
          for p in files:
              text = p.read_text(encoding='utf-8')
              if '\ufffd' in text:
                  raise RuntimeError(f'Encoding replacement character found in {p}')
          PY

          git diff --check -- chapters_v2
          echo '=== DIFF STAT ==='
          git diff --stat -- chapters_v2
          echo '=== EDITED DIFF ==='
          git diff --unified=2 -- chapters_v2

      - name: Commit clean worktree result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2
          git rm -f .github/workflows/asgar-repetition-diagnostic.yml .github/workflows/asgar-repetition-apply.yml
          git commit -m "Apply curated Asgar repetition pass"
          git push origin HEAD:asgar-repetition-pass-work
