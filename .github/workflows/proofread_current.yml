name: Temporary Russian Proofread

on:
  push:
    paths:
      - '.github/workflows/proofread_current.yml'

permissions:
  contents: write

jobs:
  proofread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LanguageTool wrapper
        run: |
          python -m pip install --upgrade pip
          pip install language-tool-python
      - name: Run Russian proofreading
        run: |
          python - <<'PY'
          from pathlib import Path
          import language_tool_python
          import re

          root = Path('chapters_v2')
          files = sorted(root.glob('*.md'))
          tool = language_tool_python.LanguageTool('ru-RU')
          out = []
          total = 0

          for p in files:
              text = p.read_text(encoding='utf-8')
              check_text = re.sub(r'(?m)^#+\s+', lambda m: ' ' * len(m.group(0)), text)
              matches = tool.check(check_text)
              if matches:
                  out.append(f'### {p.as_posix()}')
              for m in matches:
                  total += 1
                  start = max(0, m.offset - 100)
                  end = min(len(text), m.offset + m.error_length + 100)
                  ctx = text[start:end].replace('\n', ' ⏎ ')
                  bad = text[m.offset:m.offset + m.error_length]
                  reps = ', '.join(m.replacements[:8])
                  out.append(
                      f'RULE={m.rule_id}\n'
                      f'OFFSET={m.offset}\n'
                      f'BAD={bad!r}\n'
                      f'MSG={m.message}\n'
                      f'REPL={reps}\n'
                      f'CTX={ctx}\n'
                  )
          tool.close()
          report = f'TOTAL_MATCHES={total}\n\n' + '\n'.join(out)
          Path('proofread_report.tmp.txt').write_text(report, encoding='utf-8')
          print('TOTAL_MATCHES', total)
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proofread_report.tmp.txt
          git commit -m "tmp: generate Russian proofreading report"
          git push
