name: Apply Final Publishing Polish

on:
  push:
    paths:
      - '.github/workflows/proofread_current.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified copyedits and clean temporary proofing files
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('chapters_v2')
          files = sorted(root.glob('*.md'))

          ellipsis_count = 0
          for p in files:
              text = p.read_text(encoding='utf-8')
              n = text.count('...')
              if n:
                  text = text.replace('...', '…')
                  p.write_text(text, encoding='utf-8')
                  ellipsis_count += n
          assert ellipsis_count == 11, f'Expected 11 ellipses, found {ellipsis_count}'

          p = root / '03-sled.md'
          text = p.read_text(encoding='utf-8')
          old = 'Они проверили дверь в конце, заглянули за пожарный шкаф, вернулись обратно.'
          new = 'Они проверили дверь в конце, заглянули за пожарный шкаф, вернулись.'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = root / '13-posle-voyny.md'
          text = p.read_text(encoding='utf-8')
          old = 'Через несколько коридоров их остановила уже не неизвестная система, а обычная тяжёлая дверь.'
          new = 'Через несколько коридоров их остановила уже не система, а обычная тяжёлая дверь.'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git rm -f .github/workflows/proofread_current.yml proofread_report.tmp.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2
          git commit -m "Final publishing copyedit pass"
          git push
