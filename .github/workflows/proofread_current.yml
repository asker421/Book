name: Temporary Russian Proofread

on:
  push:
    paths:
      - '.github/workflows/proofread_current.yml'

permissions:
  contents: write

jobs:
  proofread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LanguageTool wrapper
        run: |
          python -m pip install --upgrade pip
          pip install language-tool-python
      - name: Run Russian proofreading
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          import language_tool_python, re

          files = sorted(Path('chapters_v2').glob('*.md'))
          tool = language_tool_python.LanguageTool('ru-RU')
          rule_counts = Counter()
          spell_counts = Counter()
          spell_examples = {}
          other = []
          raw_total = 0

          for p in files:
              text = p.read_text(encoding='utf-8')
              check_text = re.sub(r'(?m)^#+\s+', lambda m: ' ' * len(m.group(0)), text)
              for m in tool.check(check_text):
                  raw_total += 1
                  issue_type = str(getattr(m, 'rule_issue_type', '') or '')
                  rule_counts[(m.rule_id, issue_type)] += 1
                  bad = text[m.offset:m.offset + m.error_length]
                  start = max(0, m.offset - 120)
                  end = min(len(text), m.offset + m.error_length + 120)
                  ctx = text[start:end].replace('\n', ' ⏎ ')
                  reps = ', '.join(m.replacements[:8])
                  if m.rule_id == 'WHITESPACE_RULE' and m.offset == 0:
                      continue
                  if m.rule_id in {'MORFOLOGIK_RULE_RU_RU', 'RU_COMPOUNDS'}:
                      key = bad.strip()
                      spell_counts[key] += 1
                      spell_examples.setdefault(key, (p.as_posix(), m.message, reps, ctx))
                      continue
                  if issue_type.lower() == 'style':
                      continue
                  other.append((p.as_posix(), issue_type, m.rule_id, bad, m.message, reps, ctx))
          tool.close()

          out = [f'RAW_TOTAL={raw_total}', '', 'RULE_COUNTS:']
          out += [f'{n}\t{typ}\t{rid}' for (rid,typ),n in rule_counts.most_common()]
          out += ['', f'OTHER_CANDIDATES={len(other)}', '']
          for rec in other:
              p,typ,rid,bad,msg,reps,ctx = rec
              out += [f'### {p}', f'TYPE={typ}', f'RULE={rid}', f'BAD={bad!r}', f'MSG={msg}', f'REPL={reps}', f'CTX={ctx}', '']
          out += [f'SPELLING_UNIQUE={len(spell_counts)}', '']
          for word,count in sorted(spell_counts.items(), key=lambda kv:(-kv[1], kv[0].lower())):
              p,msg,reps,ctx = spell_examples[word]
              out += [f'WORD={word!r}\tCOUNT={count}\tFILE={p}', f'REPL={reps}', f'CTX={ctx}', '']
          Path('proofread_report.tmp.txt').write_text('\n'.join(out), encoding='utf-8')
          print('RAW_TOTAL', raw_total)
          print('OTHER_CANDIDATES', len(other))
          print('SPELLING_UNIQUE', len(spell_counts))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proofread_report.tmp.txt
          git commit -m "tmp: summarize Russian proofreading candidates"
          git push
