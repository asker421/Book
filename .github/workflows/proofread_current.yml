name: Temporary Russian Proofread

on:
  push:
    paths:
      - '.github/workflows/proofread_current.yml'

permissions:
  contents: write

jobs:
  proofread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run static typography checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          rows=[]
          for p in sorted(Path('chapters_v2').glob('*.md')):
              text=p.read_text(encoding='utf-8')
              def add(kind,m,detail=''):
                  line=text.count('\n',0,m.start())+1
                  a=max(0,m.start()-90); b=min(len(text),m.end()+90)
                  ctx=text[a:b].replace('\n',' ⏎ ')
                  rows.append((p.as_posix(),line,kind,m.group(0),detail,ctx))

              # Whitespace/punctuation artifacts
              for m in re.finditer(r'[^\n] {2,}[^\n]', text): add('MULTISPACE',m)
              for m in re.finditer(r'[ \t]+\n', text): add('TRAILING_WS',m)
              for m in re.finditer(r'\s+[,.!?;:](?!\d)', text): add('SPACE_BEFORE_PUNCT',m)
              for m in re.finditer(r'[,.!?;:]{3,}', text): add('PUNCT_RUN',m)
              for m in re.finditer(r'\.{4,}', text): add('DOT_RUN',m)
              for m in re.finditer(r'(?i)\b([а-яё]{2,})\s+\1\b', text): add('DUP_WORD',m)
              # Straight quote/apostrophe characters in Russian prose
              for m in re.finditer(r'["“”„]', text): add('NON_GUILLEMET_QUOTE',m)
              # Mixed script inside one token (likely accidental Latin/Cyrillic collision)
              for m in re.finditer(r'\b(?=[\w-]*[A-Za-z])(?=[\w-]*[А-Яа-яЁё])[\w-]+\b', text): add('MIXED_SCRIPT',m)
              # Hyphen-minus surrounded by spaces where em dash may have been intended
              for m in re.finditer(r'\s-\s', text): add('SPACED_HYPHEN',m)
              # Bracket / guillemet balance summary per file
              if text.count('«') != text.count('»'):
                  rows.append((p.as_posix(),0,'UNBALANCED_GUILLEMETS',f"«={text.count('«')} »={text.count('»')}",'',''))
              if text.count('(') != text.count(')'):
                  rows.append((p.as_posix(),0,'UNBALANCED_PARENS',f"(={text.count('(')} )={text.count(')')}",'',''))

          out=[f'TOTAL={len(rows)}','']
          for p,line,kind,bad,detail,ctx in rows:
              out += [f'FILE={p}',f'LINE={line}',f'KIND={kind}',f'BAD={bad!r}',f'DETAIL={detail}',f'CTX={ctx}','']
          Path('proofread_report.tmp.txt').write_text('\n'.join(out),encoding='utf-8')
          print('TOTAL',len(rows))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proofread_report.tmp.txt
          git commit -m "tmp: generate typography report"
          git push
