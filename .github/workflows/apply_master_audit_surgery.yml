name: Apply master audit surgical patches

on:
  push:
    paths:
      - '.github/workflows/apply_master_audit_surgery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact surgical replacements
        shell: python
        run: |
          from pathlib import Path

          def repl(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match in {path}, got {count}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('OK', label, path)

          # 1 — ch06 exact duplicate
          repl('chapters_v2/06-mertvyy-chelovek.md',
               'В толпе он почти не выделялся внешне. Внешне он почти не выделялся; несовместимость жила в данных.',
               'Внешне он почти не выделялся; несовместимость жила в данных.',
               'P01')

          # 2 — ch17 authorial convergence comment
          repl('chapters_v2/17-posle-vtorogo-padeniya.md',
               'Асгар отметил, что разные века иногда приходят к одной и той же осторожности разными дорогами.',
               '',
               'P02')

          # 3 — ch17 thesis paragraph
          repl('chapters_v2/17-posle-vtorogo-padeniya.md',
               'Асгар вспомнил площадь 2191 года, где одна защита пыталась исправить координаты другой. Затем город машин 2744-го, где старые задачи пережили хозяев. История будто снова повторяла одну тему на другом масштабе: система не обязана быть злой, чтобы её слишком широкая компетенция стала опасной.',
               'Асгару на секунду показалось, что он уже слышал похожую историю — только в другом веке и с другими машинами. Он не стал говорить этого Лиан.',
               'P03')

          # 4 — ch17 replace universal answer with real disagreement
          repl('chapters_v2/17-posle-vtorogo-padeniya.md',
               'Лиан показала на долину и уточнила, что Ар не считает свою модель универсальным ответом. В другом регионе люди живут в более связной среде и справляются. Здесь просто знают собственную историю отказов. Их правило не «связь плохая», а «любая связь должна иметь понятную границу и понятный способ разрыва». Даже климатическая оболочка над долиной подключена через несколько независимых шлюзов, которые можно физически закрыть.',
               'Лиан показала на долину и сказала, что в соседнем регионе живут иначе. Там внешней сети доверяют больше, ручных разрывов почти не держат и считают Ар излишне осторожным. В Ар, в свою очередь, считают соседей слишком уверенными в системах, которые однажды уже подвели людей. Спор длится несколько поколений и пока никого не убедил.',
               'P04')

          # 5 — ch18 compress provenance tutorial
          repl('chapters_v2/18-chelovek-iz-krasnoy-dveri.md',
               '''Архивом занималась пожилая женщина по имени Эс. Вместо приветствия она положила перед Асгаром три версии одной старой записи. В первой осторожно говорилось: «Вероятно связано с тем же классом явлений». Во второй осталось уже только: «То же явление». Третья уверенно называла событие «повторным появлением».\n\nАсгар прочитал все три.\n\n— И какая правильная?\n\n— Первая старше.\n\n— Я спросил не это.\n\nЭс посмотрела на него поверх экрана.\n\n— А другого ответа у меня нет.\n\nОна показала цепочку копирования. Осторожное слово исчезло при сокращении, сокращённую версию позже перевели, а уже перевод начал использоваться как самостоятельный источник.\n\n— То есть никто даже не обязан был врать, — сказал Асгар.\n\n— Не обязан.\n\n— Удобно.\n\n— Именно поэтому сначала цепочка, потом история.\n\nПо выражению её лица было понятно, что эту фразу она повторяет не впервые и совершенно не считает её философией.''',
               '''Архивом занималась пожилая женщина по имени Эс. Вместо приветствия она положила перед Асгаром две версии одной старой записи. В первой стояло: «Вероятно связано с тем же классом явлений». В более поздней слово «вероятно» уже исчезло.\n\n— Ошибка перевода? — спросил Асгар.\n\n— Сначала сокращение. Потом перевод. Потом сокращённую версию начали цитировать как исходную.\n\nАсгар отодвинул второй текст.\n\n— Показывайте то, у чего ещё видна цепочка.''',
               'P05')

          # 6 — ch18 remove second provenance proof
          repl('chapters_v2/18-chelovek-iz-krasnoy-dveri.md',
               'После восстановления питания они вернулись к поиску, но теперь Асгар просил искать не по названию легенды, а по физическим признакам: локальному геометрическому рассогласованию, внезапному появлению и исчезновению, материальным повреждениям у границы. Результатов стало меньше, однако ни один новый эпизод не выдержал цепочку происхождения достаточно хорошо, чтобы добавить его к маршруту. Эс сказала просто: среди отброшенных записей может быть настоящая; «может быть» всё равно недостаточно для карты.',
               'После восстановления питания Асгар попросил искать уже не по названию легенды, а по физическим признакам самой будки. Результатов стало меньше. Ни один новый эпизод не оказался достаточно надёжным, чтобы добавить его к маршруту.\n\n— Значит, ничего нового, — сказал Асгар.\n\n— Значит, ничего нового.',
