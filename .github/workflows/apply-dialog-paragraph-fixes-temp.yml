name: Apply chapter 7-8 paragraph fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dialog-paragraph-fixes-temp.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact requested paragraph splits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          p7 = Path('chapters_v2/07-arhiv-16-08.md')
          t7 = p7.read_text(encoding='utf-8')

          t7 = replace_once(
              t7,
              'Куратор посмотрел на него чуть дольше обычного. — Мы получим ещё двадцать пять лет исследований. Но сегодня у нас нет устройства, где можно выбрать 2014 год и отправить вас туда.',
              'Куратор посмотрел на него чуть дольше обычного.\n\n— Мы получим ещё двадцать пять лет исследований. Но сегодня у нас нет устройства, где можно выбрать 2014 год и отправить вас туда.',
              '1.1'
          )
          t7 = replace_once(
              t7,
              'Асгар посмотрел на карту. Куратор ничего не объяснял. Не требовалось. За последние дни Асгар уже видел, что перед появлением красной будки часы начинают спорить друг с другом. Он встал. — Где это?',
              'Асгар посмотрел на карту. Куратор ничего не объяснял. Не требовалось. За последние дни Асгар уже видел, что перед появлением красной будки часы начинают спорить друг с другом.\n\nОн встал.\n\n— Где это?',
              '1.2'
          )
          p7.write_text(t7, encoding='utf-8')

          p8 = Path('chapters_v2/08-vtoroe-okno.md')
          t8 = p8.read_text(encoding='utf-8')

          t8 = replace_once(
              t8,
              'Асгар поднял голову. — И там меня вернут в 2014?',
              'Асгар поднял голову.\n\n— И там меня вернут в 2014?',
              '1.3'
          )
          t8 = replace_once(
              t8,
              'Женщина выдохнула в микрофон. — Хорошо. Это место происхождения аппарата. Там может быть более полная инфраструктура и больше данных. Ваш запрос о 2014 можно передать дальше. Кнопку нужной даты мы вам не обещаем. Готовую процедуру возврата тоже.',
              'Женщина выдохнула в микрофон.\n\n— Хорошо. Это место происхождения аппарата. Там может быть более полная инфраструктура и больше данных. Ваш запрос о 2014 можно передать дальше. Кнопку нужной даты мы вам не обещаем. Готовую процедуру возврата тоже.',
              '1.4'
          )
          t8 = replace_once(
              t8,
              'Асгар несколько секунд молчал. Это была слабая надежда, но по крайней мере её не маскировали под обещание. Он почувствовал, как раздражение поднимается почти мгновенно. — Тогда зачем вы раньше говорили про возвращение?',
              'Асгар несколько секунд молчал. Это была слабая надежда, но по крайней мере её не маскировали под обещание. Он почувствовал, как раздражение поднимается почти мгновенно.\n\n— Тогда зачем вы раньше говорили про возвращение?',
              '1.5'
          )
          t8 = replace_once(
              t8,
              '— Я говорю сейчас максимально точно: маршрут аппарата не является маршрутом доставки вас домой. Ваш вопрос о 2014 — отдельный. — Который никто не умеет решить. — Сейчас — да. — А на источнике? — Там может быть доступ к более полной инфраструктуре и данным. Мы можем передать ваш запрос. Гарантировать результат не можем.',
              '— Я говорю сейчас максимально точно: маршрут аппарата не является маршрутом доставки вас домой. Ваш вопрос о 2014 — отдельный.\n\n— Который никто не умеет решить.\n\n— Сейчас — да.\n\n— А на источнике?\n\n— Там может быть доступ к более полной инфраструктуре и данным. Мы можем передать ваш запрос. Гарантировать результат не можем.',
              '1.6'
          )
          t8 = replace_once(
              t8,
              'Асгар опустил трубку чуть ниже. — А если я останусь здесь? На этот раз вопрос был настоящим. Катя находилась в тридцати метрах. Дети жили в этом году. Центр мог дать документы, жильё, медицинскую помощь, защиту от журналистов. Он мог начать узнавать людей, которых считал своей семьёй, и город, который всё ещё назывался Баку. Женщина ответила: — Остаться вы можете. Асгар ждал продолжения. — Но незавершённая связь не исчезла. Новые появления возможны. Точный риск мы не знаем.',
              'Асгар опустил трубку чуть ниже.\n\n— А если я останусь здесь?\n\nНа этот раз вопрос был настоящим. Катя находилась в тридцати метрах. Дети жили в этом году. Центр мог дать документы, жильё, медицинскую помощь, защиту от журналистов. Он мог начать узнавать людей, которых считал своей семьёй, и город, который всё ещё назывался Баку.\n\n— Остаться вы можете, — ответила женщина.\n\nАсгар ждал продолжения.\n\n— Но незавершённая связь не исчезла. Новые появления возможны. Точный риск мы не знаем.',
              '1.7'
          )
          t8 = replace_once(
              t8,
              'Он положил трубку на край открытой двери и вернулся к перегородке. У стекла куратор включил переговорную связь между залом и контрольной. Катя стояла с другой стороны. Асгар пересказал главное: даты не выбирают; аппарат движется к точке собственного происхождения; источник не является обещанием 2014; остаться можно, но связь и риск новых появлений сохраняются. Катя слушала, не перебивая. — Если ты останешься, это прекратится? — Не знают. Она закрыла глаза. — Ненавижу это слово.',
              'Он положил трубку на край открытой двери и вернулся к перегородке. У стекла куратор включил переговорную связь между залом и контрольной. Катя стояла с другой стороны. Асгар пересказал главное: даты не выбирают; аппарат движется к точке собственного происхождения; источник не является обещанием 2014; остаться можно, но связь и риск новых появлений сохраняются.\n\nКатя слушала, не перебивая.\n\n— Если ты останешься, это прекратится?\n\n— Не знают.\n\nОна закрыла глаза.\n\n— Ненавижу это слово.',
              '1.8'
          )
          t8 = replace_once(
              t8,
              '— Я тоже. — Ты собираешься снова войти? Асгар не ответил сразу. Катя резко провела ладонью по волосам. — Я хочу сказать: не ходи. Просто останься. Я двадцать пять лет хотела, чтобы ты вернулся. Ты появился сегодня, а теперь я стою за стеклом и должна думать, безопасно ли тебе жить рядом со мной. Это ненормально. Я хочу, чтобы ты остался. Асгар смотрел на неё.',
              '— Я тоже.\n\n— Ты собираешься снова войти?\n\nАсгар не ответил сразу. Катя резко провела ладонью по волосам.\n\n— Я хочу сказать: не ходи. Просто останься. Я двадцать пять лет хотела, чтобы ты вернулся. Ты появился сегодня, а теперь я стою за стеклом и должна думать, безопасно ли тебе жить рядом со мной. Это ненормально. Я хочу, чтобы ты остался.\n\nАсгар смотрел на неё.',
              '1.9'
          )
          t8 = replace_once(
              t8,
              '— А если она появится дома? Катя отвела взгляд к двум хронометрам, показывающим разные секунды. — Я знаю. — Если я останусь, мы можем опять жить вокруг периметров, камер и «возможно». — Я знаю. — А если уйду, следующий скачок может быть на сто лет. — Я знаю. На последних словах голос у неё сорвался. Катя вытерла щёку с раздражением. — Вот и всё. Я не знаю, что правильно. Я хочу, чтобы ты остался. Но я не буду делать вид, что это безопасный ответ.',
              '— А если она появится дома?\n\nКатя отвела взгляд к двум хронометрам, показывающим разные секунды.\n\n— Я знаю.\n\n— Если я останусь, мы можем опять жить вокруг периметров, камер и «возможно».\n\n— Я знаю.\n\n— А если уйду, следующий скачок может быть на сто лет.\n\n— Я знаю.\n\nНа последних словах голос у неё сорвался. Катя вытерла щёку с раздражением.\n\n— Вот и всё. Я не знаю, что правильно. Я хочу, чтобы ты остался. Но я не буду делать вид, что это безопасный ответ.',
              '1.10'
          )
          p8.write_text(t8, encoding='utf-8')

          # Guardrail: only the two requested files may be dirty at this point.
          PY
      - name: Verify exact scope and commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = $'chapters_v2/07-arhiv-16-08.md\nchapters_v2/08-vtoroe-okno.md'
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters_v2/07-arhiv-16-08.md chapters_v2/08-vtoroe-okno.md
          git commit -m "Fix dialogue paragraph breaks in chapters 7-8"
          git push
